<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · QueueSmart</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/api.js"></script>
  <script defer src="js/password-reset.js"></script>
</head>
<body class="public-page auth-page">
  <header class="landing-nav">
    <a class="landing-brand" href="index.html"><span class="brand-mark">Q</span><span>Queue<span class="brand-light">Smart</span></span></a>
  </header>
  <main class="page-content" style="max-width: 560px; margin: 4rem auto;">
    <section class="form-card">
      <h1 style="text-align: center;">Forgot your password?</h1>
      <p>Enter your account email to request a password reset link.</p>
      <form id="forgot-password-form">
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <p class="form-message" aria-live="polite"></p>
        <p id="demo-reset-link" class="form-message" aria-live="polite" hidden></p>
        <button class="button button-primary full-width" type="submit">Request reset link</button>
      </form>
      <p class="form-switch"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
</body>
</html>
