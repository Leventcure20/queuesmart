<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · QueueSmart</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/api.js"></script>
  <script defer src="js/password-reset.js"></script>
</head>
<body class="public-page auth-page">
  <header class="landing-nav">
    <a class="landing-brand" href="index.html"><span class="brand-mark">Q</span><span>Queue<span class="brand-light">Smart</span></span></a>
  </header>
  <main class="page-content" style="max-width: 560px; margin: 4rem auto;">
    <section class="form-card">
      <h1>Choose a new password</h1>
      <p>Enter a new password with at least 8 characters.</p>
      <form id="reset-password-form">
        <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <p class="form-message" aria-live="polite"></p>
        <button class="button button-primary full-width" type="submit">Update password</button>
      </form>
      <p class="form-switch"><a href="login.html">Back to sign in</a></p>
    </section>
  </main>
</body>
</html>
